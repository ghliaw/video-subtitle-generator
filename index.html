<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-or-later -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: blob: 'unsafe-eval'; style-src 'self' file:; img-src data:; worker-src blob:; base-uri 'none'; form-action 'none'">
  <title>影片字幕產生器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="subtitle.js"></script>
  <script defer src="worker.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell brand"><span class="mark" aria-hidden="true">CC</span><span>字幕工作台</span><span class="offline"><span aria-hidden="true"></span>離線模式</span></div>
  </header>
  <main class="shell">
    <div class="hero">
      <h1>影片字幕產生器</h1>
      <p>選取本機影片，自動轉錄成原語言字幕。檔案全程在這個瀏覽器內處理。</p>
    </div>

    <section class="panel import-panel" aria-labelledby="import-title">
      <h2 id="import-title">加入影片</h2>
      <div class="dropzone" id="dropzone">
        <span class="film" aria-hidden="true"></span>
        <strong>將影片拖放到這裡</strong>
        <p>支援 MP4、MOV、MKV、WebM 等格式</p>
        <div class="buttons">
          <button type="button" id="choose-file" class="primary">選擇影片</button>
          <button type="button" id="choose-folder">選擇資料夾</button>
        </div>
        <input type="file" id="file-input" accept=".mp4,.m4v,.mov,.mkv,.webm,.avi,.mpeg,.mpg,.ts,.mts,.m2ts,.flv,.wmv,.3gp,.ogv" multiple hidden>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>
      </div>
      <div class="settings">
        <div>
          <label for="language">影片語言</label>
          <select id="language">
            <option value="auto">自動辨識</option>
            <option value="zh">中文</option>
            <option value="en">英語</option>
            <option value="ja">日語</option>
            <option value="ko">韓語</option>
            <option value="vi">越南語</option>
            <option value="id">印尼語</option>
            <option value="th">泰語</option>
            <option value="es">西班牙語</option>
            <option value="fr">法語</option>
            <option value="de">德語</option>
          </select>
        </div>
        <div>
          <label for="model-mode">辨識模式</label>
          <select id="model-mode" aria-describedby="model-hint">
            <option value="base" selected>標準（Base Q5_1）</option>
            <option value="small">高準確度（Small Q5_1）</option>
          </select>
        </div>
        <div>
          <p id="model-hint">高準確度模式需要較長的處理時間與較多記憶體。</p>
          <p>資料夾會包含子資料夾。若同一批影片的語言不同，請保留自動辨識。</p>
        </div>
      </div>
    </section>

    <section class="panel queue-panel" aria-labelledby="queue-title">
      <div class="section-head">
        <div><h2 id="queue-title">處理清單</h2><p id="summary">尚未加入影片</p></div>
        <button type="button" id="clear" class="quiet" disabled>清空清單</button>
      </div>
      <p id="empty" class="empty">加入影片後，可在這裡追蹤轉錄進度並下載字幕。</p>
      <ul id="queue" class="queue" aria-label="影片處理清單"></ul>
      <div class="actions">
        <p id="message" role="status" aria-live="polite"></p>
        <div class="buttons">
          <button type="button" id="download-all" disabled>下載全部 ZIP</button>
          <button type="button" id="stop" hidden>停止處理</button>
          <button type="button" id="start" class="primary" disabled>開始產生字幕</button>
        </div>
      </div>
    </section>

    <footer>字幕以 UTF-8 <code>.srt</code> 儲存，可在 YouTube Studio 選擇「含時間碼」上傳。</footer>
    <noscript>請啟用 JavaScript 後重新開啟這個網頁。</noscript>
  </main>
</body>
</html>
